name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html site.json assets AGENT_SETUP.md _site/
          if [ -d data ]; then cp -r data _site/; fi
          # Version the asset URLs so browsers never pair a new page with a cached old app.js.
          sed -i -E "s#(assets/[a-z]+\.(js|css))\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -o 'assets/[a-z]*\.[a-z]*?v=[0-9a-f]*' _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
